name: Enzymit
description: Enzymit is a synthetic biology company based in Rehovot, Israel that designs
  novel enzymes and enables cell-free biomanufacturing. Its proprietary platform combines
  computational protein design, deep learning, and high-throughput testing to develop
  enzymes for biochemicals, food and beverage, personal care, and health and nutrition
  markets, with applications spanning hyaluronic acid production, cultivated-meat ingredients,
  and biosensors. Backed by Khosla Ventures, Enzymit publishes open research tools
  such as SolvIT (protein solubility prediction) and the StabilizeIT platform, but does
  not currently expose a public developer API, SDK, or developer portal.
